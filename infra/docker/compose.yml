version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: forumo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - '1025:1025'
      - '8025:8025'

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

  api:
    build:
      context: ../../
      dockerfile: infra/docker/api.Dockerfile
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/forumo?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: please-change-me-access
      JWT_REFRESH_SECRET: please-change-me-refresh
      PORT: 3000
    ports:
      - '3000:3000'
    volumes:
      - ../../apps/api:/app/apps/api
      - ../../packages:/app/packages
    command: pnpm --filter api start:dev

  web:
    build:
      context: ../../
      dockerfile: infra/docker/web.Dockerfile
    depends_on:
      - api
    environment:
      VITE_API_URL: http://api:3000/v1
    ports:
      - '5173:5173'
    volumes:
      - ../../apps/web:/app/apps/web
      - ../../packages:/app/packages
    command: pnpm --filter web dev --host 0.0.0.0 --port 5173

volumes:
  postgres-data:
  minio-data:
